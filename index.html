<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard EC1291 Puebla</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <main class="container">
    <header class="header">
      <p class="eyebrow">EC1291 Puebla</p>
      <h1>Dashboard Proyecto Puebla EC1291 2026</h1>
      <p class="muted">Seguimiento de evaluaciones, lotes, centros y evaluadores.</p>
      <p class="updated">Actualizado: <strong id="lastUpdated">—</strong></p>
    </header>

    <section class="cards" id="cards"></section>

    <section class="grid">
      <div class="panel">
        <div class="panel-header">
          <h2>Evaluaciones por Centro</h2>
        </div>
        <div id="centrosTable"></div>
      </div>

      <div class="panel chart-panel">
        <canvas id="centrosChart"></canvas>
      </div>
    </section>

    <section class="grid">
      <div class="panel">
        <div class="panel-header">
          <h2>Evaluaciones por Evaluador</h2>
        </div>
        <div id="evaluadoresTable"></div>
      </div>

      <div class="panel chart-panel tall">
        <canvas id="evaluadoresChart"></canvas>
      </div>
    </section>
  </main>

  <script>
    const COLORS = [
      '#2563eb',
      '#f97316',
      '#16a34a',
      '#9333ea',
      '#dc2626',
      '#0891b2',
      '#ca8a04'
    ];

    async function getData() {
      const response = await fetch('data.json', { cache: 'no-store' });

      if (!response.ok) {
        throw new Error('No se pudo cargar data.json');
      }

      return response.json();
    }

    function formatDate(value) {
      if (!value) return '—';

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) return value;

      return date.toLocaleString('es-MX', {
        year: 'numeric',
        month: 'long',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function normalizeRows(rows = []) {
      return rows
        .map(row => ({
          name: row.name || row.label || '',
          value: Number(row.count ?? row.value ?? 0)
        }))
        .filter(row => row.name && row.value >= 0);
    }

    function renderCards(cards = []) {
      const container = document.getElementById('cards');

      container.innerHTML = cards.map(card => `
        <article class="card">
          <p>${card.label}</p>
          <strong>${card.value}</strong>
        </article>
      `).join('');
    }

    function renderTable(id, rows = [], firstCol = 'Nombre') {
      const container = document.getElementById(id);

      if (!rows.length) {
        container.innerHTML = '<p class="empty">Sin datos disponibles.</p>';
        return;
      }

      const total = rows.reduce((sum, row) => sum + Number(row.value || 0), 0);

      container.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>${firstCol}</th>
                <th>Conteo</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr>
                  <td>${row.name}</td>
                  <td>${row.value}</td>
                </tr>
              `).join('')}
              <tr class="total-row">
                <td>Total</td>
                <td>${total}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    function renderPieChart(id, rows = []) {
      const ctx = document.getElementById(id);

      new Chart(ctx, {
        type: 'pie',
        data: {
          labels: rows.map(row => row.name),
          datasets: [{
            data: rows.map(row => row.value),
            backgroundColor: COLORS,
            borderColor: '#ffffff',
            borderWidth: 2
          }]
        },
        options: {
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom'
            }
          }
        }
      });
    }

    function renderBarChart(id, rows = []) {
      const ctx = document.getElementById(id);
      const ordered = [...rows].sort((a, b) => a.value - b.value);

      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ordered.map(row => row.name),
          datasets: [{
            label: 'Evaluaciones',
            data: ordered.map(row => row.value),
            backgroundColor: '#2563eb',
            borderRadius: 6
          }]
        },
        options: {
          indexAxis: 'y',
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            x: {
              beginAtZero: true,
              ticks: {
                precision: 0
              }
            },
            y: {
              ticks: {
                font: {
                  size: 11
                }
              }
            }
          }
        }
      });
    }

    function renderDashboard(data) {
      const centros = normalizeRows(data.centros);
      const evaluadores = normalizeRows(data.evaluadores);

      document.getElementById('lastUpdated').textContent = formatDate(data.lastUpdated);

      renderCards(data.cards || []);
      renderTable('centrosTable', centros, 'Centro');
      renderTable('evaluadoresTable', evaluadores, 'Evaluador');

      renderPieChart('centrosChart', centros);
      renderBarChart('evaluadoresChart', evaluadores);
    }

    getData()
      .then(renderDashboard)
      .catch(error => {
        console.error(error);

        document.querySelector('.container').innerHTML = `
          <section class="error">
            <h1>No se pudo cargar el dashboard</h1>
            <p>Revisa que <strong>data.json</strong> esté en la raíz del repositorio y que tenga formato JSON válido.</p>
          </section>
        `;
      });
  </script>
</body>
</html>
